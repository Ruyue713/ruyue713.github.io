    <style>

            background-color: #f5f7fa;

            text-align:center;
            margin-bottom:18px;
        }
        .card img {
            border-radius:6px;
            max-width:100%;
            object-fit: cover;
        }
        .card-title {
            margin-top:10px;
            font-size:17px;
            font-weight:500;
            color:#444;
        }
        .link-group {
            display:flex;
            flex-wrap:wrap;
            gap:14px;
            justify-content:center;
            margin:16px 0;
        }
        .link-group a {

            color:#2b5797;
            padding:8px 14px;
            border:1px solid #2b5797;
            border-radius:6px;
            transition:0.25s;

        .link-group a:hover{

</head>
